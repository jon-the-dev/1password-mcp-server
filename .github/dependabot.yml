version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github-actions-version:
      applies-to: version-updates
      patterns:
      - '*'
    github-actions-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: pipenv
  directory: /
  schedule:
    interval: monthly
  groups:
    pipenv-version:
      applies-to: version-updates
      patterns:
      - '*'
    pipenv-security:
      applies-to: security-updates
      patterns:
      - '*'
